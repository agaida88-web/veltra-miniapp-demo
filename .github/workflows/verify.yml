name: VELTRA verification
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python syntax
        run: python -m compileall -q server.py tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify JavaScript syntax
        run: node --check static/app.js
      - name: Verify public page navigation
        run: node tests/navigation.test.cjs
